[package]
name = "entmoot"
version = "0.1.0"
edition = "2021"
description = "Conversation-tree tracker MVP: one branch per Discord channel, staleness computed from timestamps, tend surfaces the earliest unpruned message."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
